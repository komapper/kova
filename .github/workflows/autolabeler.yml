name: Autolabeler

# Use pull_request_target (not pull_request) so the GITHUB_TOKEN keeps
# write permissions for PRs from forks. Safe because this workflow never
# checks out or runs PR code.
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  autolabeler:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - uses: release-drafter/release-drafter/autolabeler@c345907820e0396f6f44bcfd9ac4763325f8feb0 # v7.8.0
